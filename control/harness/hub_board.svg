<text x="48" y="42" font-size="24" font-weight="bold" fill="#2c3e50" text-anchor="start">Hub board — the UART junction</text>
<text x="810" y="30" font-size="11" fill="#95a5a6" text-anchor="end">Revision 2026-10-08.1</text>
<text x="48" y="68" font-size="12.5" fill="#2c3e50" text-anchor="start">Revision 2026-10-08.1: with all four drivers on the RAMPS, the hub is just R1 and the UART bus node.</text>
<text x="48" y="86" font-size="12.5" fill="#2c3e50" text-anchor="start">No 12 V, no fuse, no Phoenix header. A small perfboard beside the Mega. Keep R1 right at the TX2 pin.</text>
<text x="48" y="104" font-size="12.5" fill="#95a5a6" text-anchor="start">Nets shown; on a perfboard they are point-to-point wires underneath.</text>
<rect x="48" y="150" width="320" height="240" rx="8" fill="#eef2f3" stroke="#7f8c8d" stroke-width="2"/>
