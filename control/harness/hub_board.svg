<text x="68" y="172" font-size="9.5" fill="#95a5a6" text-anchor="start">from PSU (DC-jack adapter)</text>
<circle cx="74" cy="300" r="6" fill="#c0392b" stroke="#2c3e50" stroke-width="1.2"/>
<text x="88" y="304" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="start">12V OUT +</text>
