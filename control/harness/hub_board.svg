<text x="438" y="366" font-size="9.5" fill="#95a5a6" text-anchor="middle">to cable</text>
<rect x="198" y="108" width="300" height="34" rx="4" fill="white" stroke="#c0392b" stroke-width="1.5"/>
<rect x="198" y="108" width="300" height="34" rx="4" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="348" y="123" font-size="10.5" font-weight="bold" fill="#c0392b" text-anchor="middle">F1 fuse holder — separate printed part</text>
<text x="348" y="137" font-size="9.5" fill="#2c3e50" text-anchor="middle">1.1 A PTC when it arrives; for now the 1.6 A glass fuse</text>
<text x="674" y="150" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="start">What lands where</text>
<circle cx="681" cy="174" r="6" fill="#c0392b" stroke="#2c3e50" stroke-width="1.2"/>
<text x="696" y="178" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">Pin 1  +12 V</text>
<text x="696" y="193" font-size="10" fill="#2c3e50" text-anchor="start">PSU + → F1 holder in; F1 out → Phoenix pin 1</text>
<circle cx="681" cy="214" r="6" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.2"/>
<text x="696" y="218" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">Pin 2  GND</text>
<text x="696" y="233" font-size="10" fill="#2c3e50" text-anchor="start">GND rail (PSU -, OUT -, Y_MAX -, shield)</text>
<circle cx="681" cy="254" r="6" fill="#95a5a6" stroke="#2c3e50" stroke-width="1.2"/>
<text x="696" y="258" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">Pin 3  empty</text>
<text x="696" y="273" font-size="10" fill="#2c3e50" text-anchor="start">left open — keeps 12 V away from 5 V logic</text>
<circle cx="681" cy="294" r="6" fill="#e67e22" stroke="#2c3e50" stroke-width="1.2"/>
<text x="696" y="298" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">Pin 4  +5 V</text>
<text x="696" y="313" font-size="10" fill="#2c3e50" text-anchor="start">header 5V pin ← RAMPS Y_MAX +</text>
<circle cx="681" cy="334" r="6" fill="#f1c40f" stroke="#2c3e50" stroke-width="1.2"/>
<text x="696" y="338" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">Pin 5  KEY_STEP</text>
<text x="696" y="353" font-size="10" fill="#2c3e50" text-anchor="start">header STEP pin ← AUX-4 16 (D23)</text>
<circle cx="681" cy="374" r="6" fill="#27ae60" stroke="#2c3e50" stroke-width="1.2"/>
<text x="696" y="378" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">Pin 6  UART</text>
<text x="696" y="393" font-size="10" fill="#2c3e50" text-anchor="start">bus node ← RX2 (D17) + X/Y/Z PDN_UART</text>
<circle cx="681" cy="414" r="6" fill="#8e44ad" stroke="#2c3e50" stroke-width="1.2"/>
<text x="696" y="418" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">Pin 7  KEY_DIAG</text>
<text x="696" y="433" font-size="10" fill="#2c3e50" text-anchor="start">header DIAG pin ← Z_MAX S (D19)</text>
<circle cx="681" cy="454" r="6" fill="#2c3e50" stroke="#2c3e50" stroke-width="1.2"/>
<text x="696" y="458" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">Pin 8  shield</text>
<text x="696" y="473" font-size="10" fill="#2c3e50" text-anchor="start">shield drain → GND rail (dial end only)</text>
<text x="674" y="502" font-size="11" fill="#2c3e50" text-anchor="start">R1 (1 k): TX2 pin (D16 / AUX-4 18) → R1 → bus node.</text>
<text x="674" y="518" font-size="10" fill="#2c3e50" text-anchor="start">Bus node also joins RX2 and each dial driver's PDN_UART (its MS3 jumper pin).</text>
<text x="674" y="538" font-size="10" fill="#2c3e50" text-anchor="start">Header pins: 2.54 mm male. RAMPS side uses F-F jumpers (~10 cm).</text>
<text x="674" y="554" font-size="10" fill="#2c3e50" text-anchor="start">Everything marked - on a pad goes to the GND rail.</text>
