<svg xmlns="http://www.w3.org/2000/svg" width="1034" height="652" viewBox="0 0 1034 652" font-family="Helvetica,Arial,sans-serif">
<rect width="1034" height="652" fill="white"/>
<text x="48" y="42" font-size="24" font-weight="bold" fill="#2c3e50" text-anchor="start">Hub board — dial end</text>
<text x="48" y="68" font-size="12.5" fill="#2c3e50" text-anchor="start">The 12 V split point. Holds the one UART resistor (R1) and the UART bus node, and carries the cable header.</text>
<text x="48" y="86" font-size="12.5" fill="#2c3e50" text-anchor="start">~50 x 30 mm perfboard, seen from the component side. Nets shown; on a perfboard they are point-to-point wires underneath.</text>
<text x="48" y="104" font-size="12.5" fill="#2c3e50" text-anchor="start">Layout is a guide — place parts to suit your board. The one rule: keep R1 right at the TX2 pin and the bus node short.</text>
<rect x="48" y="150" width="416" height="272" rx="8" fill="#eef2f3" stroke="#7f8c8d" stroke-width="1.5"/>
<circle cx="74" cy="196" r="6" fill="#c0392b" stroke="#2c3e50" stroke-width="1.2"/>
<text x="88" y="200" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="start">12V IN +</text>
