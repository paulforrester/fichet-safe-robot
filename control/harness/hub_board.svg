<text x="76" y="310" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="end">BUS Z</text>
<circle cx="88" cy="338" r="6" fill="#27ae60" stroke="#2c3e50" stroke-width="1.2"/>
<text x="76" y="342" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="end">BUS E0</text>
<rect x="238" y="169" width="60" height="18" rx="3" fill="#bdc3c7" stroke="#2c3e50" stroke-width="1.3"/>
<text x="268" y="182" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="middle">R1 1k</text>
<path d="M88,178 L238,178" fill="none" stroke="#27ae60" stroke-width="2.6" stroke-linecap="round"/>
