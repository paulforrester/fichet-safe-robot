<line x1="338" y1="178" x2="338" y2="338" stroke="#27ae60" stroke-width="2.6"/>
<circle cx="338" cy="178" r="4" fill="#27ae60" stroke="#2c3e50" stroke-width="1.2"/>
<text x="348" y="246" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">bus node</text>
<text x="348" y="278" font-size="9.5" fill="#95a5a6" text-anchor="start">RX2 + R1 (from TX2) + all 4 PDN_UART</text>
<text x="508" y="150" font-size="15" font-weight="bold" fill="#2c3e50" text-anchor="start">What lands where</text>
<circle cx="515" cy="176" r="6" fill="#27ae60" stroke="#2c3e50" stroke-width="1.2"/>
<text x="530" y="180" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">TX2</text>
<text x="530" y="195" font-size="10" fill="#2c3e50" text-anchor="start">from AUX-4 pin 18 (D16) → R1 → bus node</text>
<circle cx="515" cy="218" r="6" fill="#27ae60" stroke="#2c3e50" stroke-width="1.2"/>
<text x="530" y="222" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">RX2</text>
<text x="530" y="237" font-size="10" fill="#2c3e50" text-anchor="start">from AUX-4 pin 17 (D17) → bus node</text>
<circle cx="515" cy="260" r="6" fill="#27ae60" stroke="#2c3e50" stroke-width="1.2"/>
<text x="530" y="264" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="start">BUS X / Y / Z / E0</text>
<text x="530" y="279" font-size="10" fill="#2c3e50" text-anchor="start">the four MS3 jumper pins (signal side) → bus node</text>
<text x="508" y="310" font-size="11" fill="#2c3e50" text-anchor="start">Bus = the datasheet single-wire UART (TMC2209 Fig. 4.1):</text>
<text x="508" y="326" font-size="10" fill="#2c3e50" text-anchor="start">TX2 → 1 kΩ → bus; RX2 and every PDN_UART on the bus.</text>
<text x="508" y="346" font-size="10" fill="#2c3e50" text-anchor="start">Use 2.54 mm male pins for the jumper ends; RAMPS side uses</text>
<text x="508" y="360" font-size="10" fill="#2c3e50" text-anchor="start">F–F jumpers (~10 cm). That is the whole hub board.</text>
<text x="48" y="526" font-size="9.5" fill="#95a5a6" text-anchor="start">Generated by control/harness/hub_board.py from control/wiring.md section 5.</text>
</svg>