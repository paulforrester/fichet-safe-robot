<text x="710" y="458" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">splice = the bus node</text>
<text x="710" y="474" font-size="10" fill="#7f8c8d" text-anchor="middle">solder, heat shrink,</text>
<text x="710" y="488" font-size="10" fill="#7f8c8d" text-anchor="middle">zip-tie to the deck</text>
<rect x="770" y="150" width="240" height="250" rx="8" fill="#eef2f3" stroke="#7f8c8d"/>
<text x="784" y="176" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="start">Check before fitting</text>
<text x="784" y="202" font-size="10.5" fill="#2c3e50" text-anchor="start">Multimeter on Ω, pigtail loose:</text>
<text x="784" y="219" font-size="10.5" font-weight="bold" fill="#2c3e50" text-anchor="start">TX2 → RX2: about 1 kΩ</text>
<text x="784" y="236" font-size="10.5" font-weight="bold" fill="#2c3e50" text-anchor="start">TX2 → A, B, C, KEY: about 1 kΩ each</text>
<text x="784" y="253" font-size="10.5" font-weight="bold" fill="#2c3e50" text-anchor="start">RX2 → A, B, C, KEY: about 0 Ω each</text>
<text x="784" y="270" font-size="10.5" fill="#2c3e50" text-anchor="start"></text>
<text x="784" y="287" font-size="10.5" fill="#2c3e50" text-anchor="start">Then tug each lead at the splice.</text>
<text x="784" y="304" font-size="10.5" fill="#2c3e50" text-anchor="start"></text>
<text x="784" y="321" font-size="10.5" fill="#2c3e50" text-anchor="start">Lengths: measure AUX-4 → each</text>
<text x="784" y="338" font-size="10.5" fill="#2c3e50" text-anchor="start">driver's RX pin; cut each lead to</text>
<text x="784" y="355" font-size="10.5" fill="#2c3e50" text-anchor="start">that + a few cm, splice near the</text>
<text x="784" y="372" font-size="10.5" fill="#2c3e50" text-anchor="start">middle of the RAMPS.</text>
<text x="40" y="520" font-size="11.5" fill="#2c3e50" text-anchor="start">Making the leads: cut one end off each of six F–F jumpers (or use jumper halves if they are long enough).</text>
<text x="40" y="538" font-size="11.5" fill="#2c3e50" text-anchor="start">Every lead keeps its factory-crimped female end, so a driver can still be unplugged (pull its lead off RX first). Nothing on TX or CLK.</text>
<text x="40" y="556" font-size="11.5" fill="#2c3e50" text-anchor="start">No 12 V, no 5 V, no GND on the pigtail: all six are signals. The drivers and the Mega share ground through the RAMPS.</text>
<text x="40" y="624" font-size="9.5" fill="#7f8c8d" text-anchor="start">Generated by control/harness/uart_pigtail.py from control/wiring.md section 5.</text>
</svg>