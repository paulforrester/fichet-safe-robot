<text x="40" y="42" font-size="24" font-weight="bold" fill="#2c3e50" text-anchor="start">UART pigtail — replaces the hub board</text>
<text x="1000" y="30" font-size="11" fill="#7f8c8d" text-anchor="end">Revision 2026-10-09.1</text>
<text x="40" y="68" font-size="12.5" fill="#2c3e50" text-anchor="start">Six leads, each with a female Dupont end, joined in one soldered splice. R1 (1 kΩ) sits in line in the TX2 lead.</text>
<text x="40" y="86" font-size="12.5" fill="#2c3e50" text-anchor="start">The TMC2209 single-wire UART bus (datasheet Fig. 4.1): TX2 → 1 kΩ → bus; RX2 and every driver's PDN_UART on the bus.</text>
<text x="40" y="104" font-size="12.5" fill="#7f8c8d" text-anchor="start">Reference: control/wiring.md §5. Build steps: docs/manual.md §2.5.</text>
