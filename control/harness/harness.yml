# Wiring harness for the Fichet safe robot — see control/wiring.md.
# Render: wireviz control/harness/harness.yml   (WireViz 0.4.1 + Graphviz)
# Project revision 2026-10-08.2: all four drivers on the RAMPS (key in E0);
# the UART pigtail (six leads, R1 in the TX2 lead, one splice) replaces the hub board.
# The only wire between the units is the key motor's own cable.

metadata:
  title: Fichet safe robot — harness (revision 2026-10-09.1)

connectors:
  KEYMOT:
    type: key motor 17HE19-2004S
    subtype: supplied 4-wire cable, ~1 m
    pinlabels: [A+, A-, B+, B-]
    notes: on the key turner
  E0MOT:
    type: RAMPS E0 motor header (4-pin)
    pinlabels: [2B, 2A, 1A, 1B]
    notes: on the RAMPS, dial unit
  AUX4:
    type: RAMPS AUX-4 header
    pins: [17, 18]
    pinlabels: [D17 RX2, D16 TX2]
  RX_X:
    type: X driver, top of its RX pin (4th from EN)
    pins: [1]
    pinlabels: [PDN_UART dial A addr 0]
  RX_Y:
    type: Y driver, top of its RX pin (4th from EN)
    pins: [1]
    pinlabels: [PDN_UART dial B addr 1]
  RX_Z:
    type: Z driver, top of its RX pin (4th from EN)
    pins: [1]
    pinlabels: [PDN_UART dial C addr 2]
  RX_E0:
    type: E0 driver, top of its RX pin (4th from EN)
    pins: [1]
    pinlabels: [PDN_UART key addr 3]
  SPLICE:
    type: UART pigtail splice (the bus node)
    style: simple
    notes: solder + heat shrink, zip-tied to the deck. R1 1 kΩ sits in line in the TX2 lead (since revision 2026-10-08.2; drawing revision 2026-10-09.1)

cables:
  KEYCABLE:
    type: key motor cable (supplied with the motor)
    gauge: motor lead
    length: 1.0
    colors: [BK, GN, RD, BU]
    wirelabels: [A+, A-, B+, B-]
    notes: plug it into the E0 motor header. Shorten only if the key's StallGuard reads too dull (bench stage 5).
  PIGTAIL:
    type: UART pigtail — 6 F-F jumpers, one end cut off each
    category: bundle
    wirecount: 6
    length: 0.15
    wirelabels: [TX2 (R1 1k in line), RX2, A, B, C, KEY]
    notes: each lead keeps a female Dupont end; cut to measured length + a few cm

connections:
  -
    - KEYMOT: [1, 2, 3, 4]
    - KEYCABLE: [1, 2, 3, 4]
    - E0MOT: [1, 2, 3, 4]
  -
    - AUX4: [18, 17]
    - PIGTAIL: [1, 2]
    - SPLICE
  -
    - RX_X: [1]
    - PIGTAIL: [3]
    - SPLICE
  -
    - RX_Y: [1]
    - PIGTAIL: [4]
    - SPLICE
  -
    - RX_Z: [1]
    - PIGTAIL: [5]
    - SPLICE
  -
    - RX_E0: [1]
    - PIGTAIL: [6]
    - SPLICE
